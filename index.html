<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Shutdown Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-white">Auto-Shutdown Monitor</h1>
            <div id="connection-status" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-700 text-gray-300">Connecting...</div>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-blue-400">Configuration</h2>
                <div class="space-y-2 text-sm">
                    <p><span class="text-gray-400">Target IP:</span> <span id="conf-ip" class="font-mono text-white">-</span></p>
                    <p><span class="text-gray-400">Ping Interval:</span> <span id="conf-ping" class="font-mono text-white">-</span> seconds</p>
                    <p><span class="text-gray-400">Timeout Threshold:</span> <span id="conf-timeout" class="font-mono text-white">-</span> seconds</p>
                    <p><span class="text-gray-400">Shutdown Delay:</span> <span id="conf-delay" class="font-mono text-white">-</span> minutes</p>
                </div>
            </div>
            
            <div class="bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-green-400">Live Status</h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-gray-400 text-sm">Current Fail Duration</p>
                        <p class="text-4xl font-bold" id="state-fail">0s</p>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2.5">
                        <div id="fail-progress" class="bg-green-500 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-gray-800 rounded-lg shadow-lg border border-gray-700 overflow-hidden">
            <div class="p-4 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-200">System Logs (Today)</h2>
                <span class="text-xs text-gray-400">Auto-refreshing</span>
            </div>
            <div class="p-4 bg-black/50 font-mono text-sm h-64 overflow-y-auto" id="log-container">
                <div class="text-gray-500 italic">Waiting for logs...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                
                document.getElementById('connection-status').textContent = 'Connected';
                document.getElementById('connection-status').className = 'px-3 py-1 rounded-full text-sm font-medium bg-green-900/50 text-green-400 border border-green-800';
                
                // Config
                document.getElementById('conf-ip').textContent = data.config.TARGET_IP || 'Not configured';
                document.getElementById('conf-ping').textContent = data.config.PING_INTERVAL || '-';
                document.getElementById('conf-timeout').textContent = data.config.FAIL_TIMEOUT || '-';
                document.getElementById('conf-delay').textContent = data.config.SHUTDOWN_DELAY || '0';
                
                // State
                const failDuration = data.state.fail_duration || 0;
                const timeout = parseInt(data.config.FAIL_TIMEOUT) || 300;
                
                document.getElementById('state-fail').textContent = failDuration + 's';
                
                const progress = Math.min(100, (failDuration / timeout) * 100);
                const progressBar = document.getElementById('fail-progress');
                progressBar.style.width = progress + '%';
                
                if (failDuration === 0) {
                    progressBar.className = 'bg-green-500 h-2.5 rounded-full transition-all duration-500';
                    document.getElementById('state-fail').className = 'text-4xl font-bold text-green-400';
                } else if (progress < 80) {
                    progressBar.className = 'bg-yellow-500 h-2.5 rounded-full transition-all duration-500';
                    document.getElementById('state-fail').className = 'text-4xl font-bold text-yellow-400';
                } else {
                    progressBar.className = 'bg-red-500 h-2.5 rounded-full transition-all duration-500';
                    document.getElementById('state-fail').className = 'text-4xl font-bold text-red-400';
                }
                
                // Logs
                const logContainer = document.getElementById('log-container');
                if (data.logs && data.logs.length > 0) {
                    // Check if scrolled to bottom before updating
                    const isScrolledToBottom = logContainer.scrollHeight - logContainer.clientHeight <= logContainer.scrollTop + 50;
                    
                    logContainer.innerHTML = data.logs.map(log => {
                        let colorClass = 'text-gray-300';
                        if (log.includes('No response')) colorClass = 'text-yellow-400';
                        if (log.includes('Initiating server shutdown')) colorClass = 'text-red-400 font-bold';
                        if (log.includes('Connection restored')) colorClass = 'text-green-400';
                        return `<div class="${colorClass}">${log}</div>`;
                    }).join('');
                    
                    if (isScrolledToBottom) {
                        logContainer.scrollTop = logContainer.scrollHeight;
                    }
                } else {
                    logContainer.innerHTML = '<div class="text-gray-500 italic">No logs found for today.</div>';
                }
                
            } catch (err) {
                console.error(err);
                document.getElementById('connection-status').textContent = 'Disconnected';
                document.getElementById('connection-status').className = 'px-3 py-1 rounded-full text-sm font-medium bg-red-900/50 text-red-400 border border-red-800';
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
